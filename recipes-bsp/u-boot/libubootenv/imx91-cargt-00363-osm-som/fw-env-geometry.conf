# U-Boot environment geometry for this machine.
# Consumed by fw-env-config-gen.sh (run at boot by fw-env-config.service)
# to regenerate /etc/fw_env.config pointed at whichever device this
# system actually booted from (eMMC or SD card). Must match the
# U-Boot defconfig's CONFIG_ENV_OFFSET / CONFIG_ENV_SIZE.
ENV_OFFSET=0x700000
ENV_SIZE=0x4000
