# EtherCAT device drivers from igh-ethercat and the RT kernel match the NETC
# blocks by device tree compatible and PCI ID, so udev autoloads them on every
# boot even when no EtherCAT master is configured. ec_netc_blk_ctrl then fails
# ("Driver 'nxp-netc-blk-ctrl' is already registered"), and an unconfigured
# EtherCAT master plus a second set of ENETC drivers get loaded next to the
# built-in ones.
#
# Blacklisting only stops autoloading by alias. The ethercat service still loads
# its DEVICE_MODULES by name once /etc/ethercat.conf is configured.
blacklist ec_netc_blk_ctrl
blacklist ec_enetc
blacklist ec_enetc4
blacklist ec_enetc_core
blacklist ec_enetc_vf
blacklist fsl_ecat_enetc_core
blacklist fsl_ecat_enetc4
