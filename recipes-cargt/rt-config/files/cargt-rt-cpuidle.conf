# cargt-imx-rt: keep every CPU out of deep idle states, leaving only WFI
# (state0). On the i.MX 95, waking from cpu-pd-wait (state1) added hundreds of
# microseconds to a 1 ms periodic SCHED_FIFO loop (264 us worst case vs 37 us).
# This costs idle power. To allow deep idle again until reboot:
#   for s in /sys/devices/system/cpu/cpu*/cpuidle/state[1-9]*/disable; do echo 0 > $s; done
# To allow it permanently, mask this file:
#   ln -s /dev/null /etc/tmpfiles.d/cargt-rt-cpuidle.conf
w /sys/devices/system/cpu/cpu*/cpuidle/state[1-9]*/disable - - - - 1
