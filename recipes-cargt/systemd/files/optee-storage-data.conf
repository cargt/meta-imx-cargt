# Keep OP-TEE's REE FS secure storage on /data instead of /var/lib/tee.
# /var/lib/tee is on the rootfs, which an A/B update replaces, so keys and
# PKCS#11 objects created before an update would be gone after it. /data is
# shared by both slots, and the hardware unique key that encrypts the storage
# is fixed per chip (from the ELE on i.MX 9, the CAAM on i.MX 8M Plus), so both
# slots can read it.
#
# tee-supplicant starts before /data is mounted but opens this directory only
# on the first secure-storage request. optee-storage-data.service creates it
# once /data is mounted; before that /data is root-owned, so an early request
# fails and is retried instead of writing to the rootfs under the mount point.
# On an NFS root the wrapper keeps the default /var/lib/tee.
# A -f/--fs-parent-path in OPTARGS (/etc/default/tee-supplicant) still wins.
[Service]
ExecStart=
ExecStart=/usr/libexec/optee-storage-data/tee-supplicant $OPTARGS /dev/%I
