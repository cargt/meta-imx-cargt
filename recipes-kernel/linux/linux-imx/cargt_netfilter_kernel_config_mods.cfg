# NetworkManager ipv4.method=shared (Wi-Fi AP / Ethernet sharing with NAT).
# With the default nftables backend NM loads one transaction per shared
# connection that ends in "reject"; without NFT_REJECT the kernel refuses the
# whole transaction, so the masquerade rule never lands and clients get an
# address but no route out. The iptables backend tags its rules with
# "-m comment", which needs xt_comment.
CONFIG_NFT_REJECT=m
CONFIG_NFT_REJECT_INET=m
CONFIG_NETFILTER_XT_MATCH_COMMENT=m
