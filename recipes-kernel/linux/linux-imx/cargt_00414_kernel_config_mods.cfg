# Cargt i.MX 95 00414 OSM-L SOM

# 00365 carrier ETH_B PHY management: i.MX 95 NETC has a single EMDIO
# controller, so the second RTL8211FI's MDIO is bit-banged on the ENET2
# MDC/MDIO pads (virtual,mdio-gpio).
CONFIG_MDIO_GPIO=y

# Same fix as the 00363 fragment: with no userspace firmware helper in the
# rootfs, the legacy fallback blocks boot waiting for regulatory.db.
# CONFIG_FW_LOADER_USER_HELPER is not set
# CONFIG_FW_LOADER_USER_HELPER_FALLBACK is not set
