# cargt-imx-rt distro: fully preemptible (PREEMPT_RT) kernel.
# Already set by real-time-edge-linux's imx_v8_defconfig; kept here so the
# kernel config audit flags it if a defconfig change drops it.
CONFIG_PREEMPT_RT=y

# Run every CPU at full clock. On i.MX 95 (00414 and FRDM-IMX95) ondemand
# added about 16 us to the average idle cyclictest latency (22 -> 6 us).
# Costs idle power and heat; non-RT distros keep ondemand.
CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y
# CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND is not set
