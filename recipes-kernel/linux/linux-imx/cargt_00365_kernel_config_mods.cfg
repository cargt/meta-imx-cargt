# CONFIG_LOGO is not set
CONFIG_RTC_DRV_RV3032=y
CONFIG_DRM_TI_SN65DSI83=y

CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y
CONFIG_DEBUG_INFO=y
# CONFIG_DEBUG_INFO_REDUCED is not set

# Add support for 2.8" SPI display (GLT028240320IS1-CTP)
CONFIG_DRM_MIPI_DBI=y
CONFIG_TINYDRM_ST7789T3=y

# Add support for 5.5" MIPI DSI display (GLT0557201280IS1-CTP)
CONFIG_TOUCHSCREEN_ILITEK=y
CONFIG_TOUCHSCREEN_ILI210X=y
CONFIG_DRM_PANEL_ILITEK_ILI9881C=y

# Add support for MAX25221 for 10" LVDS (GLT1011280800IS1-CTP)
CONFIG_SENSORS_MAX25221=y
CONFIG_MFD_MAX25221=y
CONFIG_REGULATOR_MAX25221=y

# Add support for PPP for modems
CONFIG_PPP=y
CONFIG_PPP_ASYNC=y
CONFIG_PPP_SYNC_TTY=y
CONFIG_PPP_DEFLATE=y
CONFIG_PPP_BSDCOMP=y
CONFIG_PPP_MPPE=y