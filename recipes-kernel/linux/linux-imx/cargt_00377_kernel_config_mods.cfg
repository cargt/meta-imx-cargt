# Add support for EPSON RX8111 RTC on the SOM
CONFIG_RTC_DRV_RX8111=y

CONFIG_MXC_GPU_VIV=y

# DRM_IMX95_DPU (dpu95-ld.c) calls imx_dispmu_send_msg/client_register/unregister
# but its Kconfig entry has no depends-on/select for IMX_DISPMU, so the two can
# end up mismatched (DRM_IMX95_DPU=y, IMX_DISPMU unset) and vmlinux fails to link.
CONFIG_IMX_DISPMU=y

# Temporary: enable verbose btnxpuart tracing for Bluetooth firmware-download debugging
CONFIG_DYNAMIC_DEBUG_CORE=y
CONFIG_DYNAMIC_DEBUG=y
