# Add support for EPSON RX8111 RTC on the SOM
CONFIG_RTC_DRV_RX8111=y

# Disable the legacy udev-based firmware-loading fallback (2026-07-16): with
# no userspace firmware helper in this rootfs, a failed direct firmware load
# (e.g. cfg80211's regulatory.db, which we don't ship) blocks synchronously
# waiting on a sysfs request nothing will ever service. cfg80211's regulatory
# init runs via late_initcall(), i.e. inside the kernel's own boot sequence
# before rootfs is even mounted, so this was hanging the entire boot for the
# fallback timeout (observed as stuck indefinitely at "faux_driver
# regulatory: Direct firmware load for regulatory.db failed..."). No modern
# system needs this legacy mechanism; disabling it makes a missing-firmware
# load fail fast instead of blocking.
# CONFIG_FW_LOADER_USER_HELPER is not set
# CONFIG_FW_LOADER_USER_HELPER_FALLBACK is not set
