# Trusted and encrypted keys backed by OP-TEE on i.MX 9.
#
# i.MX 9 has no CAAM, so imx_v8_defconfig's TRUSTED_KEYS_CAAM backend never
# binds there and trusted keys are unusable. OP-TEE's trusted-keys TA
# (f04a0fe7-1f5d-4b9b-abf7-619b85b4ce8c) is on the TEE bus, sealing blobs with
# the ELE-derived hardware unique key.
#
# Not applied to i.MX 8M Plus: the kernel tries trusted-key sources in the
# order tpm, tee, caam, so enabling TEE there would move existing CAAM-sealed
# keys to a different backend.
CONFIG_TRUSTED_KEYS_TEE=y
CONFIG_ENCRYPTED_KEYS=m
