include conf/distro/include/cargt-imx-base.inc
include conf/distro/include/cargt-imx-preferred-env.inc

DISTRO = "cargt-imx-xwayland-ap"

INIT_MANAGER = "systemd"

# Remove conflicting backends
DISTRO_FEATURES:remove = "directfb "
DISTRO_FEATURES:append = " x11 wayland pam systemd cargt-ap"

NETWORK_MANAGER = "systemd"
RDEPENDS:packagegroup-core-tools-testapps:remove = "connman-tools connman-tests connman-client "

VIRTUAL-RUNTIME_syslog = ""
VIRTUAL-RUNTIME_base-utils-syslog = ""
