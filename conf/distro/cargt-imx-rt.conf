# Cargt i.MX distro with the NXP Real-time Edge 3.5 PREEMPT_RT kernel.
#
# cargt-imx-xwayland plus the real-time-edge-linux kernel (lf-6.18.20 + PREEMPT_RT,
# TSN, DSA) and the Real-time Edge userspace (see cargt-image-rt). Needs
# sources/meta-real-time-edge and sources/meta-rtos-industrial in BBLAYERS;
# imx-cargt-setup.sh adds them when DISTRO=cargt-imx-rt.
#
# We do not use NXP's "real-time-edge" override: under it meta-real-time-edge
# replaces the whole linux-imx and u-boot-imx SRC_URI (dropping every Cargt
# patch and board dts), swaps U-Boot to real-time-edge-uboot, and selects the
# NXP EVK System Manager configs. Our "cargt-rt" override only switches the
# kernel source (recipes-kernel/linux/linux-imx_%.bbappend), so U-Boot, OEI and
# the System Manager stay the validated Cargt BSP ones.

require conf/distro/cargt-imx-xwayland.conf

DISTRO = "cargt-imx-rt"
DISTRO_NAME = "Cargt i.MX Real-time Distro"

DISTROOVERRIDES:append = ":cargt-rt"

# Real-time Edge package configuration (EtherCAT on ENETC for i.MX 95, OPC UA)
include conf/distro/include/igh-ethercat.inc
include conf/distro/include/libopen62541.inc

DISTRO_FEATURES:append:mx95-nxp-bsp = " modbus-simulator"
