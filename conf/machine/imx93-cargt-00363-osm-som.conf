#@TYPE: Machine
#@NAME: Cargt NXP i.MX 93
#@SOC: i.MX93
#@DESCRIPTION: Machine configuration for Cargt NXP i.MX 93 00363 SOM
#@MAINTAINER: Tim Carney <tim.carney@cargt.com>

MACHINEOVERRIDES =. "mx93:"

require include/imx93-cargt.inc

KERNEL_DEVICETREE_BASENAME = "imx93-cargt-00363-osm-som"

KERNEL_DEVICETREE = " \
    freescale/${KERNEL_DEVICETREE_BASENAME}.dtb \
"

KERNEL_DTB = "${KERNEL_DEVICETREE_BASENAME}.dtb"

UBOOT_DTB_NAME = "imx93-cargt-00363-osm-som.dtb"
UBOOT_CONFIG_BASENAME = "imx93-cargt-00363-osm-som"

DDR_FIRMWARE_NAME = " \
    lpddr4_dmem_1d_v202201.bin \
    lpddr4_dmem_2d_v202201.bin \
    lpddr4_imem_1d_v202201.bin \
    lpddr4_imem_2d_v202201.bin \
"

IMXBOOT_TARGETS = "flash_singleboot"

MACHINE_FEATURES:append = " dpdk rdp nxpwifi-all-sdio 00363"
MACHINE_FIRMWARE:append = " ethos-u-firmware"

WKS_FILE = "cargt-dev.wks.in"

PACKAGE_FEED_ARCHS = "all  armv8a  armv8a-mx93  imx93_cargt_00363_osm_som"
PACKAGE_FEED_BASE_PATHS = ""
PACKAGE_FEED_URIS = "https://yocto.cargt.com/scarthgap"
