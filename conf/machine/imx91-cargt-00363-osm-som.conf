#@TYPE: Machine
#@NAME: Cargt NXP i.MX 91
#@SOC: i.MX91
#@DESCRIPTION: Machine configuration for Cargt NXP i.MX 91 00363 OSM-L SOM
#@MAINTAINER: Tim Carney <tim.carney@cargt.com>

MACHINEOVERRIDES =. "mx91:"

require include/imx91-cargt.inc

KERNEL_DEVICETREE_BASENAME = "imx91-cargt-00363-osm-som"

KERNEL_DTB = "${KERNEL_DEVICETREE_BASENAME}.dtb"

UBOOT_DTB_NAME = "imx91-cargt-00363-osm-som.dtb"
UBOOT_CONFIG_BASENAME = "imx91-cargt-00363-osm-som"

DDR_FIRMWARE_NAME = " \
    lpddr4_dmem_1d_v202201.bin \
    lpddr4_dmem_2d_v202201.bin \
    lpddr4_imem_1d_v202201.bin \
    lpddr4_imem_2d_v202201.bin \
"

MACHINE_FEATURES:append = " rdp nxpwifi-nxpiw612-sdio 00363 "

WKS_FILE = "cargt-dev.wks.in"

PACKAGE_FEED_ARCHS = "all  armv8a  armv8a-mx91  imx91_cargt_00363_osm_som"
PACKAGE_FEED_BASE_PATHS = ""
PACKAGE_FEED_URIS = "https://yocto.cargt.com/linux-imx/scarthgap"
