MACHINEOVERRIDES =. "mx95:"

require include/imx95-cargt-00414.inc

KERNEL_DEVICETREE_BASENAME = "imx95-cargt-00414-00365"

KERNEL_DEVICETREE = " \
    freescale/${KERNEL_DEVICETREE_BASENAME}.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-glt0557201280is1.dtb \
    freescale/${KERNEL_DEVICETREE_BASENAME}-glt1011280800is1.dtb \
"

KERNEL_DTB = "${KERNEL_DEVICETREE_BASENAME}.dtb"

UBOOT_DTB_NAME = "imx95-cargt-00414-00365.dtb"
UBOOT_CONFIG_BASENAME = "imx95-cargt-00414-00365"

MACHINE_FEATURES:append = " rdp 00414 00365 "

WKS_FILE = "cargt-dev.wks.in"

PACKAGE_FEED_ARCHS = "all  armv8a  armv8a-mx95  imx95_cargt_00414_osm_som imx95_cargt_00414_00365"
PACKAGE_FEED_BASE_PATHS = ""
PACKAGE_FEED_URIS = "https://yocto.cargt.com/linux-imx/wrynose"
