#@TYPE: Machine
#@NAME: Cargt NXP i.MX 95
#@SOC: i.MX95
#@DESCRIPTION: Machine configuration for Cargt NXP i.MX 95 00414 OSM-L SOM on 00365 carrier
#@MAINTAINER: Tim Carney <tim.carney@cargt.com>

MACHINEOVERRIDES =. "mx95:"

require include/imx95-cargt.inc

KERNEL_DEVICETREE_BASENAME = "imx95-cargt-00414-00365"

KERNEL_DEVICETREE = " \
    freescale/${KERNEL_DEVICETREE_BASENAME}.dtb \
"

KERNEL_DTB = "${KERNEL_DEVICETREE_BASENAME}.dtb"

UBOOT_DTB_NAME = "imx95-cargt-00414-00365.dtb"
UBOOT_CONFIG_BASENAME = "imx95-cargt-00414-00365"

# 00414 SOM: 19x19 i.MX 95 with LPDDR5 (MT62F4G32D8DV) and the EVK PMIC set
# (PF09 + PF5301 + PF5302). DDR init runs in OEI using the NXP 19x19 LPDDR5
# EVK board config and timing.
# TODO: confirm the EVK timing matches the 00414 DDR part/density, or
#       generate a 00414 timing file with the NXP DDR config tool.
OEI_BOARD = "mx95lp5"
DDR_TYPE  = "lpddr5"
DDR_FIRMWARE_NAME = " \
    lpddr5_dmem_v202409.bin \
    lpddr5_dmem_qb_v202409.bin \
    lpddr5_imem_v202409.bin \
    lpddr5_imem_qb_v202409.bin \
"
OEI_DDR_CONFIG     = "MIMX95_LPDDR5_EVK_19X19_6400MTS_FW2024.09_timing"
OEI_DDR_CONFIG_ECC = "MIMX95_LPDDR5_EVK_19X19_6400MTS_FW2024.09_ECC_enabled_timing"

# SM board port and resource config (recipes-bsp/imx-system-manager)
SYSTEM_MANAGER_CONFIG = "mx95cargt00414"

MACHINE_FEATURES:append = " rdp 00414 00365 "

WKS_FILE = "cargt-dev.wks.in"

PACKAGE_FEED_ARCHS = "all  armv8a  armv8a-mx95  imx95_cargt_00414_osm_som imx95_cargt_00414_00365"
PACKAGE_FEED_BASE_PATHS = ""
PACKAGE_FEED_URIS = "https://yocto.cargt.com/linux-imx/wrynose"
