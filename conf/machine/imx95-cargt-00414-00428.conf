#@TYPE: Machine
#@NAME: Cargt NXP i.MX 95
#@SOC: i.MX95
#@DESCRIPTION: Machine configuration for Cargt NXP i.MX 95 00414 OSM-L SOM on 00428 carrier
#@MAINTAINER: Tim Carney <tim.carney@cargt.com>

MACHINEOVERRIDES =. "mx95:"

require include/imx95-cargt-00414.inc

KERNEL_DEVICETREE_BASENAME = "imx95-cargt-00414-00428"

KERNEL_DEVICETREE = " \
    freescale/${KERNEL_DEVICETREE_BASENAME}.dtb \
"

KERNEL_DTB = "${KERNEL_DEVICETREE_BASENAME}.dtb"

UBOOT_DTB_NAME = "imx95-cargt-00414-00428.dtb"
UBOOT_CONFIG_BASENAME = "imx95-cargt-00414-00428"

MACHINE_FEATURES:append = " rdp 00414 00428 "

WKS_FILE = "cargt-dev.wks.in"

# Also use the SOM machine's feed (package feed defaults: conf/distro/include/cargt-imx-base.inc)
PACKAGE_FEED_ARCHS:append = " imx95_cargt_00414_osm_som"
