#@TYPE: Machine
#@NAME: Cargt NXP i.MX 8MP
#@SOC: i.MX8Mplus
#@DESCRIPTION: Machine configuration for Cargt NXP i.MX 8MP 00377 SOM
#@MAINTAINER: Tim Carney <tim.carney@cargt.com>

require include/imx8mp-cargt.inc

KERNEL_DEVICETREE_BASENAME = "imx8mp-cargt-00377-00365"

KERNEL_DEVICETREE = " \
    freescale/${KERNEL_DEVICETREE_BASENAME}.dtb \
	freescale/${KERNEL_DEVICETREE_BASENAME}-glt0557201280is1.dtb \
	freescale/${KERNEL_DEVICETREE_BASENAME}-glt1011280800is1.dtb \
	freescale/${KERNEL_DEVICETREE_BASENAME}-hdmi.dtb \
"

KERNEL_DTB = "${KERNEL_DEVICETREE_BASENAME}.dtb"

UBOOT_DTB_NAME = "imx8mp-cargt-00377-00365.dtb"
UBOOT_CONFIG_BASENAME = "imx8mp-cargt-00377-00365"

# Set DDR FIRMWARE
DDR_FIRMWARE_VERSION = "202006"
DDR_FIRMWARE_NAME = " \
	lpddr4_pmu_train_1d_dmem_${DDR_FIRMWARE_VERSION}.bin \
	lpddr4_pmu_train_1d_imem_${DDR_FIRMWARE_VERSION}.bin \
	lpddr4_pmu_train_2d_dmem_${DDR_FIRMWARE_VERSION}.bin \
	lpddr4_pmu_train_2d_imem_${DDR_FIRMWARE_VERSION}.bin \
"

IMXBOOT_TARGETS_BASENAME = "flash_evk"

# Mainline BSP doesn't support LPDDR4 so it must be set to nxp.
# Also this machine isn't supported by u-boot-fslc but imx8mn-evk.inc already
# set the bootloader to u-boot-imx instead when NXP BSP is used.
IMX_DEFAULT_BSP = "nxp"
MACHINE_FEATURES:append = " dpdk rdp nxpwifi-all-sdio 00377 00365 "

WKS_FILE = "cargt-dev.wks.in"

PACKAGE_FEED_ARCHS = "all  armv8a  armv8a-mx8mp  imx8mp_cargt_00377_00365"
PACKAGE_FEED_BASE_PATHS = ""
PACKAGE_FEED_URIS = "https://yocto.cargt.com/linux-imx/scarthgap"
