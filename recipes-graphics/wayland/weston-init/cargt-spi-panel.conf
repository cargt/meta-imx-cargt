# Pick a pixman/RGB565 weston.ini for the 00379 SPI display; see
# cargt-weston-spi-panel. The env file only exists when that display is
# present, so other boards run Weston unchanged. systemd reads it when
# ExecStart runs, after ExecStartPre has written it.
[Service]
ExecStartPre=+/usr/libexec/cargt-weston-spi-panel
EnvironmentFile=-/run/cargt-weston/env
